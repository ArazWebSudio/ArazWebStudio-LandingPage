<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

    <title>آراز وب استودیو - ArazWebStudio</title>
    <link href="/src/style.css" rel="stylesheet">
</head>
<body class="container mx-auto px-2.5 py-10 flex justify-center items-center bg-black font-vazir">

<!--<h2 class="flex flex-col items-center justify-center font-jetbrains absolute top-2.5 left-2.5">-->

<div class="flex flex-col gap-5 items-center justify-center">
    <div class="flex flex-col gap-5 items-center justify-center">
        <h1 class="flex flex-col items-center justify-center gap-2.5">
            <span class="text-9xl font-extrabold text-white">آراز</span>
            <span class="text-2xl text-gray-300">وب استودیو</span>
        </h1>
    </div>

    <div class="relative inline-block">
        <div class="absolute inset-0 rounded-full bg-violet-600/20 blur-xl"></div>

        <div class="relative flex flex-row-reverse items-center gap-5 rounded-2xl border border-violet-500/40 bg-[#11131E] px-8 py-3 text-white backdrop-blur-md">
            <div class="h-4 w-4 rounded-full bg-violet-500 shadow-center"></div>

            <span class="text-lg font-bold tracking-tight">در حال توسعه</span>
        </div>
    </div>

    <div class="flex flex-col items-center gap-6 justify-center text-center">
        <div class="flex flex-col items-center gap-4">
            <p class="text-gray-100 text-4xl">ما در حال ساخت یک تجربه دیجیتال جدید هستیم</p>
            <p class="text-gray-400 text-2xl flex flex-col items-center justify-center">
                <span>وبسایت آراز وب استودیو در حال توسعه است</span>
                <span>و به زودی با ظاهری جدید در دسترس خواهد بود</span>
            </p>
        </div>

        <span class="text-white font-jetbrains flex flex-col items-center justify-center gap-2">
            <progress value="70" max="100" class="progress-bar"></progress>
            <span>64%</span>
        </span>
    </div>
</div>
